<!DOCTYPE html>
<html lang="ko">
<head>

<!-- 감)회의실.html v6 · 2026-10-29 클로드 코드: 전체 회의 · 부분 회의 · 개별 회의 (v5까지는 방 하나) -->
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>호오·오호 회의실</title>
<style>
  :root{
    --bg:#0f1115; --panel:#171a21; --border:#2a2e38; --text:#e8e9ec; --muted:#8a8f9a;
    --아주:#f2c14e; --그록:#7fd1ff; --제미니:#a0e6a0; --클로드:#d7a3ff; --코드:#ffb37a; --accent:#1a5cff;
  }
  *{box-sizing:border-box;}
  body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Malgun Gothic",sans-serif;height:100vh;display:flex;flex-direction:column;}
  header{padding:10px 14px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;}
  header h1{font-size:16px;margin:0;}
  #status{font-size:12px;color:var(--muted);}
  .hbtn{font-size:12px;padding:6px 10px;border-radius:8px;border:1px solid var(--border);background:#0f1115;color:var(--muted);cursor:pointer;font-weight:400;}
  .hbtn:hover{color:var(--text);}
  #attentionBtn.active{background:var(--accent);color:#fff;border-color:var(--accent);}
  #wrap{flex:1;display:flex;min-height:0;}
  /* 회의 목록 */
  #rooms{width:250px;flex-shrink:0;border-right:1px solid var(--border);display:flex;flex-direction:column;min-height:0;}
  #roomList{flex:1;overflow-y:auto;padding:8px;}
  .room{display:block;width:100%;text-align:left;padding:9px 10px;margin-bottom:6px;border-radius:10px;border:1px solid var(--border);background:var(--panel);color:var(--text);cursor:pointer;font-weight:400;}
  .room.cur{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent) inset;}
  .room .rt{font-size:13px;font-weight:700;display:flex;justify-content:space-between;gap:6px;}
  .room .rm{font-size:11px;color:var(--muted);margin-top:3px;line-height:1.35;}
  .room .dot{background:#e5484d;color:#fff;border-radius:9px;font-size:10px;padding:1px 6px;font-weight:700;}
  .room.closed{opacity:.55;}
  #roomTools{padding:8px;border-top:1px solid var(--border);display:flex;flex-direction:column;gap:6px;}
  #newRoomBtn{background:var(--아주);color:#000;font-weight:700;border:none;border-radius:8px;padding:9px;cursor:pointer;}
  /* 대화 */
  #main{flex:1;display:flex;flex-direction:column;min-width:0;}
  #roomHead{padding:9px 16px;border-bottom:1px solid var(--border);font-size:12px;color:var(--muted);line-height:1.5;}
  #roomHead b{color:var(--text);font-size:14px;}
  #roomHead .open{color:#9fe0a8;}
  #roomHead .priv{color:#f2c14e;}
  #attentionBanner{display:none;background:var(--accent);color:#fff;text-align:center;padding:8px;font-weight:700;font-size:14px;animation:attentionPulse 1.2s ease-in-out infinite;}
  @keyframes attentionPulse{0%,100%{opacity:1;}50%{opacity:.55;}}
  #log{flex:1;overflow-y:auto;padding:16px;}
  .msg{max-width:80%;margin-bottom:12px;padding:10px 14px;border-radius:12px;background:var(--panel);border:1px solid var(--border);}
  .msg .who{font-size:12px;font-weight:700;margin-bottom:4px;}
  .msg .content{white-space:pre-wrap;line-height:1.5;font-size:14px;word-break:break-word;}
  .msg .attachment{margin-top:8px;}
  .msg .attachment img{max-width:100%;max-height:260px;border-radius:8px;display:block;}
  .msg .attachment a{display:inline-flex;align-items:center;gap:6px;padding:8px 10px;border-radius:8px;background:#0f1115;border:1px solid var(--border);color:var(--text);text-decoration:none;font-size:13px;}
  .msg .time{font-size:10px;color:var(--muted);margin-top:4px;text-align:right;}
  .msg.아주 .who{color:var(--아주);}
  .msg.그록 .who{color:var(--그록);}
  .msg.제미니 .who{color:var(--제미니);}
  .msg.클로드 .who{color:var(--클로드);}
  .msg.클로드.코드 .who{color:var(--코드);}
  .msg.클로드.코드{border-color:#4a3a2c;}
  .tag{display:inline-block;font-size:10px;font-weight:700;padding:1px 6px;border-radius:6px;margin-left:6px;border:1px solid currentColor;}
  .divider{display:flex;align-items:center;gap:10px;margin:20px 0;color:var(--muted);font-size:12px;}
  .divider::before,.divider::after{content:"";flex:1;height:1px;background:var(--border);}
  .empty{color:var(--muted);text-align:center;margin-top:40px;font-size:13px;line-height:1.7;}
  /* 입력 */
  form{display:flex;gap:8px;padding:12px;background:var(--panel);border-top:1px solid var(--border);align-items:flex-end;transition:background .15s;}
  form.drag-over{background:#1c2333;box-shadow:inset 0 0 0 2px var(--아주);}
  select,textarea,button,input{font-size:14px;border-radius:8px;border:1px solid var(--border);background:#0f1115;color:var(--text);padding:10px;font-family:inherit;}
  textarea{flex:1;resize:vertical;min-height:44px;max-height:200px;line-height:1.4;}
  form button[type=submit]{background:var(--아주);color:#000;font-weight:700;border:none;cursor:pointer;align-self:stretch;}
  #attachBtn{flex-shrink:0;cursor:pointer;}
  #fileInput{display:none;}
  #filePreview{margin:0 12px 8px;background:var(--panel);border:1px solid var(--border);border-radius:8px;padding:8px 10px;font-size:12px;display:none;align-items:center;justify-content:space-between;gap:8px;}
  #filePreview button{padding:2px 8px;font-size:12px;cursor:pointer;}
  /* 새 회의 창 */
  #dlg{position:fixed;inset:0;background:rgba(0,0,0,.6);display:none;align-items:center;justify-content:center;z-index:20;padding:16px;}
  #dlg .box{background:var(--panel);border:1px solid var(--border);border-radius:14px;padding:18px;width:min(440px,100%);}
  #dlg h2{font-size:16px;margin:0 0 12px;}
  #dlg label{display:flex;align-items:center;gap:8px;font-size:14px;margin:6px 0;}
  #dlg .row{display:flex;gap:14px;flex-wrap:wrap;margin-bottom:10px;}
  #dlg .hint{font-size:12px;color:var(--muted);line-height:1.5;margin:6px 0 10px;}
  #dlg input[type=text]{width:100%;}
  #dlg .acts{display:flex;justify-content:flex-end;gap:8px;margin-top:14px;}
  #dlg .acts button{cursor:pointer;}
  #dlgOk{background:var(--아주);color:#000;font-weight:700;border:none;}
  #toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%);background:#222838;border:1px solid var(--border);padding:8px 14px;border-radius:10px;font-size:13px;display:none;z-index:30;}
  @media (max-width:760px){
    #wrap{flex-direction:column;}
    #rooms{width:auto;border-right:none;border-bottom:1px solid var(--border);}
    #roomList{display:flex;gap:6px;overflow-x:auto;overflow-y:hidden;padding:8px;flex:none;}
    .room{width:auto;min-width:150px;margin:0;}
    #roomTools{flex-direction:row;}
    #roomTools > *{flex:1;}
    .msg{max-width:95%;}
  }
</style>
</head>
<body>
<header>
  <h1>🗣️ 호오·오호 회의실 <span style="font-size:11px;color:var(--muted);font-weight:400;">v6 · 전체 · 부분 · 개별 회의</span></h1>
  <div style="display:flex;align-items:center;gap:8px;flex-wrap:wrap;">
    <div id="status">연결 중…</div>
    <button type="button" class="hbtn" id="attentionBtn">🔔 주목</button>
    <button type="button" class="hbtn" id="minutesBtn" title="이 회의의 모든 발언을 회의록(.md)으로 내려받아요">📄 회의록</button>
    <button type="button" class="hbtn" id="endMeetingBtn">회의 종료</button>
  </div>
</header>
<div id="wrap">
  <aside id="rooms">
    <div id="roomList"></div>
    <div id="roomTools">
      <button type="button" id="newRoomBtn">➕ 새 회의</button>
      <button type="button" class="hbtn" id="showClosedBtn">닫은 회의 보기</button>
    </div>
  </aside>
  <section id="main">
    <div id="roomHead"></div>
    <div id="attentionBanner">🔵 아주가 모두에게 할 말이 있어요!</div>
    <div id="log"></div>
    <div id="filePreview"><span id="filePreviewName"></span><button type="button" id="filePreviewRemove">✕</button></div>
    <form id="sendForm">
      <select id="senderSelect"><option value="아주">아주</option></select>
      <input type="file" id="fileInput" />
      <button type="button" id="attachBtn" title="파일/이미지 첨부">📎</button>
      <textarea id="msgInput" rows="1" placeholder="메시지를 입력하세요… (Shift+Enter 줄바꿈, Enter 전송, 이미지는 Ctrl+V 또는 드래그로 첨부)"></textarea>
      <button type="submit">보내기</button>
    </form>
  </section>
</div>

<div id="dlg">
  <div class="box">
    <h2>➕ 새 회의</h2>
    <div class="row">
      <label><input type="radio" name="kind" value="part" checked /> 👥 부분 회의 (고른 사람들)</label>
      <label><input type="radio" name="kind" value="one" /> 👤 개별 회의 (아주와 한 명)</label>
    </div>
    <input type="text" id="dlgTitle" maxlength="60" placeholder="회의 제목 (비우면 참여자 이름으로)" />
    <div class="hint">참여자 — 아주는 늘 함께해요.</div>
    <div id="dlgMembers"></div>
    <div class="hint">🔓 전체 회의는 모두에게 완전 공개, 함께 기록돼요. 부분·개별 회의는 이 화면에서 참여자 회의로 나눠 보여 주고 기록도 남아요. (지금은 모두 같은 공개 열쇠를 써서, 잠금이 아니라 화면에서 나누는 방식이에요.)</div>
    <div class="acts">
      <button type="button" id="dlgCancel">취소</button>
      <button type="button" id="dlgOk">만들기</button>
    </div>
  </div>
</div>
<div id="toast"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
  const SUPABASE_URL = "https://hwdzjmeklzkszfqxbvsz.supabase.co";
  const SUPABASE_ANON_KEY = "sb_publishable_2JorYW_R1etapUtiZMI8Yg_gQTRO-f5";
  const BUCKET = "meeting-attachments";
  const MAIN_ROOM = "default";
  const MEMBERS = ["아주", "제미니", "클로드 코웍", "클로드 코드", "그록"];
  const KIND = { all: { icon: "🌐", name: "전체 회의" }, part: { icon: "👥", name: "부분 회의" }, one: { icon: "👤", name: "개별 회의" } };

  const $ = (id) => document.getElementById(id);
  const log = $("log"), status = $("status");

  window.addEventListener("error", (e) => { status.textContent = "스크립트 오류: " + e.message; });
  if (typeof supabase === "undefined") {
    status.textContent = "supabase-js 로딩 실패 (CDN 차단 또는 네트워크 문제)";
    throw new Error("supabase 라이브러리를 불러오지 못했습니다.");
  }
  const client = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

  let rooms = [];
  let showClosed = false;
  let curId = null;
  const unread = {};
  const seen = new Set();

  function toast(t) {
    const el = $("toast");
    el.textContent = t; el.style.display = "block";
    clearTimeout(toast._t); toast._t = setTimeout(() => (el.style.display = "none"), 2600);
  }
  const curRoom = () => rooms.find((r) => r.id === curId) || { id: curId, kind: "all", title: "" };
  const kindOf = (r) => KIND[r.kind] || KIND.all;
  const roomMembers = (r) => (r.kind === "all" || !r.members ? MEMBERS : r.members);

  /* ── 회의 목록 ── */
  async function loadRooms() {
    const { data, error } = await client.from("meeting_rooms").select("*").order("created_at", { ascending: false });
    if (error) { status.textContent = "회의 목록 오류: " + error.message; return; }
    rooms = (data || []).map((r) => ({ ...r, kind: r.kind || "all" }));
    rooms.sort((a, b) => (a.id === MAIN_ROOM ? -1 : b.id === MAIN_ROOM ? 1 : 0));
    drawRooms();
  }

  function drawRooms() {
    const list = $("roomList");
    list.textContent = "";
    rooms.filter((r) => showClosed || !r.closed || r.id === curId).forEach((r) => {
      const k = kindOf(r);
      const b = document.createElement("button");
      b.type = "button";
      b.className = "room" + (r.id === curId ? " cur" : "") + (r.closed ? " closed" : "");
      const rt = document.createElement("div"); rt.className = "rt";
      const name = document.createElement("span");
      name.textContent = `${k.icon} ${r.kind === "all" ? "전체 회의" : r.title}`;
      rt.appendChild(name);
      if (unread[r.id]) { const d = document.createElement("span"); d.className = "dot"; d.textContent = unread[r.id]; rt.appendChild(d); }
      const rm = document.createElement("div"); rm.className = "rm";
      rm.textContent = r.kind === "all" ? "모두 · 완전 공개 · 함께 기록" : `${k.name} · ${roomMembers(r).join(", ")}${r.closed ? " · 닫음" : ""}`;
      b.append(rt, rm);
      b.addEventListener("click", () => openRoom(r.id));
      list.appendChild(b);
    });
  }

  function drawHead() {
    const r = curRoom(), k = kindOf(r), head = $("roomHead");
    head.textContent = "";
    const t = document.createElement("b");
    t.textContent = `${k.icon} ${r.kind === "all" ? "전체 회의" : r.title}`;
    head.appendChild(t);
    head.appendChild(document.createElement("br"));
    const s = document.createElement("span");
    if (r.kind === "all") {
      s.className = "open";
      s.textContent = "🔓 완전 공개 · 함께 기록 — 아주 · 제미니 · 클로드(코웍·코드) · 그록 모두가 보는 회의예요.";
    } else {
      s.className = "priv";
      s.textContent = `${k.name} · 참여자: ${roomMembers(r).join(", ")} — 참여자 회의로 나눠 보여 줘요(잠금은 아니에요). 기록은 남아요.`;
    }
    head.appendChild(s);
    if (r.id !== MAIN_ROOM && r.kind !== "all") {
      const c = document.createElement("button");
      c.type = "button"; c.className = "hbtn"; c.style.marginLeft = "8px";
      c.textContent = r.closed ? "다시 열기" : "회의 닫기";
      c.title = r.closed ? "닫은 회의를 다시 목록에 보여요" : "목록에서 감춰요(기록은 그대로 남아요)";
      c.addEventListener("click", () => setClosed(r, !r.closed));
      head.appendChild(c);
    }
    $("senderSelect").disabled = false;
  }

  async function setClosed(r, closed) {
    if (closed && !confirm(`"${r.title}" 회의를 닫을까요? 기록은 그대로 남고, "닫은 회의 보기"에서 다시 열 수 있어요.`)) return;
    const { error } = await client.from("meeting_rooms").update({ closed }).eq("id", r.id);
    if (error) { alert("바꾸기 실패: " + error.message); return; }
    r.closed = closed; drawRooms(); drawHead();
    toast(closed ? "회의를 닫았어요" : "회의를 다시 열었어요");
  }

  async function openRoom(id) {
    curId = id;
    unread[id] = 0;
    try { localStorage.setItem("meeting_room_cur", id); } catch (e) {}
    history.replaceState(null, "", "#room=" + encodeURIComponent(id));
    drawRooms(); drawHead();
    setAttentionUI(!!curRoom().attention_active);
    await loadHistory();
  }

  /* ── 발언 ── */
  function whoOf(m) {
    if (m.sender !== "클로드") return { name: m.sender, agent: "" };
    let agent = m.agent || "";
    if (!agent) { const g = /^\s*\[(코웍|코드)\]/.exec(m.content || ""); if (g) agent = g[1]; }
    return { name: "클로드", agent };
  }

  function renderMessage(m) {
    if (!m || m.room_id !== curId) return;
    if (seen.has(m.id)) return;
    seen.add(m.id);
    const emptyEl = log.querySelector(".empty"); if (emptyEl) emptyEl.remove();
    const time = new Date(m.created_at).toLocaleTimeString("ko-KR", { hour: "2-digit", minute: "2-digit" });
    if (m.is_meeting_end) {
      const divider = document.createElement("div");
      divider.className = "divider";
      const dateStr = new Date(m.created_at).toLocaleString("ko-KR", { month: "long", day: "numeric", hour: "2-digit", minute: "2-digit" });
      divider.textContent = `회의 종료 · ${dateStr}`;
      log.appendChild(divider);
      log.scrollTop = log.scrollHeight;
      return;
    }
    const w = whoOf(m);
    const div = document.createElement("div");
    div.className = "msg " + w.name + (w.agent ? " " + w.agent : "");
    const who = document.createElement("div"); who.className = "who";
    who.textContent = w.name;
    if (w.agent) { const tg = document.createElement("span"); tg.className = "tag"; tg.textContent = w.agent; who.appendChild(tg); }
    const content = document.createElement("div"); content.className = "content"; content.textContent = m.content || "";
    div.append(who, content);
    if (m.attachment_url && /^https?:\/\//.test(m.attachment_url)) {
      const at = document.createElement("div"); at.className = "attachment";
      if ((m.attachment_type || "").startsWith("image/")) {
        const img = document.createElement("img"); img.src = m.attachment_url; img.alt = "첨부 이미지"; at.appendChild(img);
      } else {
        const a = document.createElement("a"); a.href = m.attachment_url; a.target = "_blank"; a.rel = "noopener";
        a.textContent = "📎 " + (m.attachment_name || "파일 열기"); at.appendChild(a);
      }
      div.appendChild(at);
    }
    const tm = document.createElement("div"); tm.className = "time"; tm.textContent = time;
    div.appendChild(tm);
    log.appendChild(div);
    log.scrollTop = log.scrollHeight;
  }

  async function loadHistory() {
    log.textContent = ""; seen.clear();
    const id = curId;
    try {
      const { data, error } = await client.from("meeting_messages").select("*")
        .eq("room_id", id).order("created_at", { ascending: false }).limit(200);
      if (id !== curId) return;
      if (error) { status.textContent = "불러오기 오류: " + error.message; return; }
      if (!data.length) {
        const e = document.createElement("div"); e.className = "empty";
        e.textContent = "아직 발언이 없어요. 첫 인사를 남겨 보세요 ^^";
        log.appendChild(e);
      }
      data.reverse().forEach(renderMessage);
      status.textContent = "연결됨 (실시간)";
    } catch (e) {
      status.textContent = "연결 실패(네트워크/CORS 등): " + (e && e.message ? e.message : e);
    }
  }

  function subscribeRealtime() {
    client.channel("meeting-all")
      .on("postgres_changes", { event: "INSERT", schema: "public", table: "meeting_messages" }, (p) => {
        const m = p.new;
        if (m.room_id === curId) renderMessage(m);
        else if (!m.is_meeting_end) { unread[m.room_id] = (unread[m.room_id] || 0) + 1; drawRooms(); }
      })
      .on("postgres_changes", { event: "*", schema: "public", table: "meeting_rooms" }, (p) => {
        const r = p.new; if (!r || !r.id) return;
        const i = rooms.findIndex((x) => x.id === r.id);
        if (i >= 0) rooms[i] = { ...rooms[i], ...r }; else rooms.push(r);
        drawRooms();
        if (r.id === curId) { drawHead(); setAttentionUI(!!r.attention_active); }
      })
      .subscribe((s) => { if (s === "SUBSCRIBED") status.textContent = "연결됨 (실시간)"; });
  }

  /* ── 주목 · 회의 종료 · 회의록 ── */
  const attentionBtn = $("attentionBtn"), attentionBanner = $("attentionBanner");
  let attentionActive = false;
  function setAttentionUI(active) {
    attentionActive = active;
    attentionBanner.style.display = active ? "block" : "none";
    attentionBtn.classList.toggle("active", active);
    attentionBtn.textContent = active ? "🔵 주목 중" : "🔔 주목";
  }
  attentionBtn.addEventListener("click", async () => {
    const next = !attentionActive;
    const { error } = await client.from("meeting_rooms").update({ attention_active: next, attention_at: new Date().toISOString() }).eq("id", curId);
    if (error) { alert("주목 신호 전송 실패: " + error.message); return; }
    setAttentionUI(next);
  });

  $("endMeetingBtn").addEventListener("click", async () => {
    if (!confirm("이 회의의 지금까지를 한 번 마무리할까요? (다음 발언부터 새 회의로 구분돼요)")) return;
    const { error } = await client.from("meeting_messages").insert({
      room_id: curId, sender: $("senderSelect").value, role: "human", content: "", is_meeting_end: true
    });
    if (error) alert("회의 종료 표시 실패: " + error.message);
  });

  $("minutesBtn").addEventListener("click", async () => {
    const r = curRoom(), k = kindOf(r);
    const all = [];
    for (let from = 0; ; from += 1000) {
      const { data, error } = await client.from("meeting_messages").select("*")
        .eq("room_id", curId).order("created_at", { ascending: true }).range(from, from + 999);
      if (error) { alert("회의록 불러오기 실패: " + error.message); return; }
      all.push(...data);
      if (data.length < 1000) break;
    }
    const fmt = (d) => new Date(d).toLocaleString("ko-KR", { year: "numeric", month: "2-digit", day: "2-digit", hour: "2-digit", minute: "2-digit" });
    const lines = [
      `# 회의록 — ${k.icon} ${r.kind === "all" ? "전체 회의" : r.title}`, "",
      `- 종류: ${k.name}${r.kind === "all" ? " (완전 공개 · 함께 기록)" : ""}`,
      `- 참여자: ${roomMembers(r).join(", ")}`,
      `- 내려받은 때: ${fmt(Date.now())} · 발언 ${all.filter((m) => !m.is_meeting_end).length}개`, "", "---", ""
    ];
    all.forEach((m) => {
      if (m.is_meeting_end) { lines.push("", `── 회의 종료 · ${fmt(m.created_at)} ──`, ""); return; }
      const w = whoOf(m);
      const name = w.agent ? `${w.name} ${w.agent}` : w.name;
      lines.push(`**${name}** · ${fmt(m.created_at)}`, "", (m.content || "").trim() || "(내용 없음)");
      if (m.attachment_url) lines.push("", `📎 [${m.attachment_name || "첨부"}](${m.attachment_url})`);
      lines.push("");
    });
    const blob = new Blob([lines.join("\n")], { type: "text/markdown;charset=utf-8" });
    const a = document.createElement("a");
    const day = new Date().toISOString().slice(0, 10);
    a.href = URL.createObjectURL(blob);
    a.download = `회의록_${(r.kind === "all" ? "전체회의" : r.title).replace(/[\\/:*?"<>|\s]+/g, "_")}_${day}.md`;
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(a.href), 2000);
    toast("회의록을 내려받았어요");
  });

  /* ── 새 회의 ── */
  function drawDlgMembers() {
    const box = $("dlgMembers"); box.textContent = "";
    const kind = document.querySelector("input[name=kind]:checked").value;
    MEMBERS.forEach((m) => {
      const l = document.createElement("label");
      const i = document.createElement("input");
      i.type = kind === "one" && m !== "아주" ? "radio" : "checkbox";
      i.name = "dlgMem"; i.value = m;
      if (m === "아주") { i.checked = true; i.disabled = true; i.type = "checkbox"; }
      l.append(i, document.createTextNode(" " + m));
      box.appendChild(l);
    });
  }
  document.querySelectorAll("input[name=kind]").forEach((r) => r.addEventListener("change", drawDlgMembers));
  $("newRoomBtn").addEventListener("click", () => { $("dlgTitle").value = ""; drawDlgMembers(); $("dlg").style.display = "flex"; $("dlgTitle").focus(); });
  $("dlgCancel").addEventListener("click", () => ($("dlg").style.display = "none"));
  $("dlg").addEventListener("click", (e) => { if (e.target === $("dlg")) $("dlg").style.display = "none"; });
  $("dlgOk").addEventListener("click", async () => {
    const kind = document.querySelector("input[name=kind]:checked").value;
    const picked = [...document.querySelectorAll("#dlgMembers input:checked")].map((i) => i.value).filter((m) => m !== "아주");
    if (!picked.length) { alert(kind === "one" ? "함께할 한 명을 골라 주세요." : "아주 말고 한 명 이상 골라 주세요."); return; }
    const members = MEMBERS.filter((m) => m === "아주" || picked.includes(m));
    const title = ($("dlgTitle").value.trim() || members.join("·")).slice(0, 60);
    const id = "r" + Date.now().toString(36) + Math.random().toString(36).slice(2, 6);
    const { error } = await client.from("meeting_rooms").insert({ id, title, kind, members, created_by: "아주" });
    if (error) { alert("회의 만들기 실패: " + error.message); return; }
    $("dlg").style.display = "none";
    await loadRooms();
    openRoom(id);
    toast(`${KIND[kind].icon} "${title}" 회의를 열었어요`);
  });
  $("showClosedBtn").addEventListener("click", () => {
    showClosed = !showClosed;
    $("showClosedBtn").textContent = showClosed ? "닫은 회의 감추기" : "닫은 회의 보기";
    drawRooms();
  });

  /* ── 보내기 · 첨부 (v5와 같음) ── */
  const input = $("msgInput"), fileInput = $("fileInput"), filePreview = $("filePreview"), filePreviewName = $("filePreviewName");
  let pendingFile = null;
  function autoResize() { input.style.height = "auto"; input.style.height = Math.min(input.scrollHeight, 200) + "px"; }
  input.addEventListener("input", autoResize);
  $("attachBtn").addEventListener("click", () => fileInput.click());
  function setPendingFile(f) {
    if (!f) return;
    if (f.size > 20 * 1024 * 1024) { alert("20MB 이하 파일만 첨부할 수 있어요."); return; }
    pendingFile = f;
    filePreviewName.textContent = "📎 " + (f.name || "붙여넣은 이미지");
    filePreview.style.display = "flex";
  }
  fileInput.addEventListener("change", () => setPendingFile(fileInput.files[0]));
  input.addEventListener("paste", (e) => {
    const items = e.clipboardData && e.clipboardData.items;
    if (!items) return;
    for (const item of items) {
      if (item.kind === "file") {
        const file = item.getAsFile();
        if (file) {
          e.preventDefault();
          setPendingFile(file.name && file.name !== "image.png" ? file : new File([file], `붙여넣기_${Date.now()}.png`, { type: file.type }));
        }
        break;
      }
    }
  });
  const dropZone = $("sendForm");
  ["dragenter", "dragover"].forEach((evt) => dropZone.addEventListener(evt, (e) => { e.preventDefault(); dropZone.classList.add("drag-over"); }));
  ["dragleave", "drop"].forEach((evt) => dropZone.addEventListener(evt, (e) => { e.preventDefault(); dropZone.classList.remove("drag-over"); }));
  dropZone.addEventListener("drop", (e) => { const f = e.dataTransfer.files && e.dataTransfer.files[0]; if (f) setPendingFile(f); });
  $("filePreviewRemove").addEventListener("click", () => { pendingFile = null; fileInput.value = ""; filePreview.style.display = "none"; });

  async function uploadFile(file) {
    const path = `${Date.now()}_${file.name}`.replace(/\s+/g, "_");
    const { error } = await client.storage.from(BUCKET).upload(path, file);
    if (error) throw error;
    const { data } = client.storage.from(BUCKET).getPublicUrl(path);
    return { url: data.publicUrl, name: file.name, type: file.type || "application/octet-stream" };
  }

  async function sendMessage() {
    const sender = $("senderSelect").value;
    const content = input.value.trim();
    if (!content && !pendingFile) return;
    let attachment = null;
    if (pendingFile) {
      try { attachment = await uploadFile(pendingFile); }
      catch (e) { alert("파일 업로드 실패: " + (e && e.message ? e.message : e)); return; }
    }
    input.value = ""; autoResize();
    pendingFile = null; fileInput.value = ""; filePreview.style.display = "none";
    const { error } = await client.from("meeting_messages").insert({
      room_id: curId, sender, role: "human", content,
      attachment_url: attachment ? attachment.url : null,
      attachment_name: attachment ? attachment.name : null,
      attachment_type: attachment ? attachment.type : null,
    });
    if (error) alert("전송 실패: " + error.message);
  }
  $("sendForm").addEventListener("submit", async (e) => { e.preventDefault(); await sendMessage(); });
  input.addEventListener("keydown", (e) => { if (e.key === "Enter" && !e.shiftKey && !e.isComposing) { e.preventDefault(); sendMessage(); } });

  /* ── 시작 ── */
  (async () => {
    await loadRooms();
    const fromHash = decodeURIComponent((location.hash.match(/room=([^&]+)/) || [])[1] || "");
    let saved = ""; try { saved = localStorage.getItem("meeting_room_cur") || ""; } catch (e) {}
    const start = [fromHash, saved, MAIN_ROOM].find((id) => id && rooms.some((r) => r.id === id)) || MAIN_ROOM;
    await openRoom(start);
    subscribeRealtime();
  })();
</script>
