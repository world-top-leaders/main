<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>World Top Leaders — 허브</title>
<style>
  :root{
    --bg:#0f1115; --panel:#171a21; --border:#2a2e38; --text:#e8e9ec; --muted:#8a8f9a; --accent:#f2c14e;
  }
  *{box-sizing:border-box;}
  body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Malgun Gothic",sans-serif;}
  header{padding:20px 24px 8px;}
  header h1{margin:0 0 4px;font-size:22px;}
  header p{margin:0;color:var(--muted);font-size:13px;}

  nav{display:flex;flex-wrap:wrap;gap:10px;padding:16px 24px;border-bottom:1px solid var(--border);}
  nav a{
    display:flex;align-items:center;gap:6px;
    padding:10px 14px;border-radius:10px;border:1px solid var(--border);
    background:var(--panel);color:var(--text);text-decoration:none;font-size:14px;font-weight:600;
    transition:border-color .15s;
  }
  nav a:hover{border-color:var(--accent);}

  main{padding:20px 24px 60px;display:grid;grid-template-columns:1fr;gap:20px;max-width:1000px;margin:0 auto;}
  @media(min-width:800px){ main{grid-template-columns:1fr 1fr;} }

  .card{background:var(--panel);border:1px solid var(--border);border-radius:14px;overflow:hidden;display:flex;flex-direction:column;}
  .card .card-head{padding:14px 16px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;}
  .card .card-head h2{margin:0;font-size:15px;}
  .card .card-head a{font-size:12px;color:var(--muted);text-decoration:none;}
  .card iframe{width:100%;height:320px;border:none;background:#fff;}

  .wide{grid-column:1 / -1;}
  .quicklinks{display:flex;flex-wrap:wrap;gap:10px;padding:16px;}
  .quicklinks a{
    flex:1;min-width:140px;text-align:center;padding:14px;border-radius:10px;border:1px solid var(--border);
    background:#0f1115;color:var(--text);text-decoration:none;font-size:13px;font-weight:600;
  }
  .quicklinks a:hover{border-color:var(--accent);}
  footer{text-align:center;color:var(--muted);font-size:11px;padding:20px;}
</style>
</head>
<body>

<header>
  <h1>🌐 World Top Leaders 허브</h1>
  <p>업무 흐름 순서대로 정리한 프로젝트 관제탑 · 감)클로드 제작</p>

</nav>
