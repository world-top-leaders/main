<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>World Top Leaders — 실시간 회의실</title>
<style>
  :root{
    --bg:#0f1115; --panel:#171a21; --border:#2a2e38; --text:#e8e9ec; --muted:#8a8f9a;
    --아주:#f2c14e; --그록:#7fd1ff; --제미니:#a0e6a0; --클로드:#d7a3ff;
  }
  *{box-sizing:border-box;}
  body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Malgun Gothic",sans-serif;}
  header{padding:14px 16px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;}
  header h1{font-size:16px;margin:0;}
  #status{font-size:12px;color:var(--muted);}
  #log{height:calc(100vh - 160px);overflow-y:auto;padding:16px;}
  .msg{max-width:80%;margin-bottom:12px;padding:10px 14px;border-radius:12px;background:var(--panel);border:1px solid var(--border);}
  .msg .who{font-size:12px;font-weight:700;margin-bottom:4px;}
  .msg .content{white-space:pre-wrap;line-height:1.5;font-size:14px;}
  .msg .attachment{margin-top:8px;}
  .msg .attachment img{max-width:100%;max-height:260px;border-radius:8px;display:block;}
  .msg .attachment a.file-link{display:inline-flex;align-items:center;gap:6px;padding:8px 10px;border-radius:8px;background:#0f1115;border:1px solid var(--border);color:var(--text);text-decoration:none;font-size:13px;}
  .msg .time{font-size:10px;color:var(--muted);margin-top:4px;text-align:right;}
  .msg.아주 .who{color:var(--아주);}
  .msg.그록 .who{color:var(--그록);}
  .msg.제미니 .who{color:var(--제미니);}
  .msg.클로드 .who{color:var(--클로드);}
  form{position:fixed;bottom:0;left:0;right:0;display:flex;gap:8px;padding:12px;background:var(--panel);border-top:1px solid var(--border);align-items:flex-end;}
  select,textarea,button{font-size:14px;border-radius:8px;border:1px solid var(--border);background:#0f1115;color:var(--text);padding:10px;}
  select{flex-shrink:0;}
  textarea{flex:1;resize:vertical;min-height:44px;max-height:200px;font-family:inherit;line-height:1.4;}
  button{background:var(--아주);color:#000;font-weight:700;border:none;cursor:pointer;align-self:stretch;}
  #attachBtn{background:#0f1115;color:var(--text);font-weight:400;flex-shrink:0;}
  #fileInput{display:none;}
  #filePreview{position:fixed;bottom:64px;left:12px;right:12px;background:var(--panel);border:1px solid var(--border);border-radius:8px;padding:8px 10px;font-size:12px;display:none;align-items:center;justify-content:space-between;gap:8px;}
  #filePreview button{padding:2px 8px;font-size:12px;}
</style>
</head>
<body>
<header>
  <h1>🗣️ World Top Leaders 회의실</h1>
  <div id="status">연결 중…</div>
</header>
<div id="log"></div>
<div id="filePreview">
  <span id="filePreviewName"></span>
  <button type="button" id="filePreviewRemove">✕</button>
</div>
<form id="sendForm">
  <select id="senderSelect">
    <option value="아주">아주</option>
  </select>
  <input type="file" id="fileInput" />
  <button type="button" id="attachBtn" title="파일/이미지 첨부">📎</button>
  <textarea id="msgInput" rows="1" placeholder="메시지를 입력하세요… (Shift+Enter로 줄바꿈, Enter로 전송)"></textarea>
  <button type="submit">보내기</button>
</form>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
  const SUPABASE_URL = "https://hwdzjmeklzkszfqxbvsz.supabase.co";
  const SUPABASE_ANON_KEY = "sb_publishable_2JorYW_R1etapUtiZMI8Yg_gQTRO-f5";
  const ROOM_ID = "default";
  const BUCKET = "meeting-attachments";

  const log = document.getElementById("log");
  const status = document.getElementById("status");

  window.addEventListener("error", (e) => {
    status.textContent = "스크립트 오류: " + e.message;
  });

  if (typeof supabase === "undefined") {
    status.textContent = "supabase-js 로딩 실패 (CDN 차단 또는 네트워크 문제)";
    throw new Error("supabase 라이브러리를 불러오지 못했습니다.");
  }
  const client = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

  function renderMessage(m){
    const div = document.createElement("div");
    div.className = `msg ${m.sender}`;
    const time = new Date(m.created_at).toLocaleTimeString("ko-KR",{hour:"2-digit",minute:"2-digit"});

    let attachmentHtml = "";
    if (m.attachment_url) {
      if ((m.attachment_type || "").startsWith("image/")) {
        attachmentHtml = `<div class="attachment"><img src="${m.attachment_url}" alt="첨부 이미지" /></div>`;
      } else {
        attachmentHtml = `<div class="attachment"><a class="file-link" href="${m.attachment_url}" target="_blank" rel="noopener">📎 <span class="fname"></span></a></div>`;
      }
    }

    div.innerHTML = `<div class="who">${m.sender}</div><div class="content"></div>${attachmentHtml}<div class="time">${time}</div>`;
    div.querySelector(".content").textContent = m.content || "";
    const fnameEl = div.querySelector(".fname");
    if (fnameEl) fnameEl.textContent = m.attachment_name || "파일 열기";

    log.appendChild(div);
    log.scrollTop = log.scrollHeight;
  }

  async function loadHistory(){
    try {
      const { data, error } = await client
        .from("meeting_messages")
        .select("*")
        .eq("room_id", ROOM_ID)
        .order("created_at", { ascending: true })
        .limit(200);
      if (error) { status.textContent = "불러오기 오류: " + error.message; console.error(error); return; }
      data.forEach(renderMessage);
      status.textContent = "연결됨 (실시간)";
    } catch (e) {
      status.textContent = "연결 실패(네트워크/CORS 등): " + (e && e.message ? e.message : e);
      console.error("loadHistory 예외:", e);
    }
  }

  function subscribeRealtime(){
    client
      .channel("room-" + ROOM_ID)
      .on("postgres_changes",
        { event: "INSERT", schema: "public", table: "meeting_messages", filter: `room_id=eq.${ROOM_ID}` },
        (payload) => renderMessage(payload.new)
      )
      .subscribe((s) => { if (s === "SUBSCRIBED") status.textContent = "연결됨 (실시간)"; });
  }

  const input = document.getElementById("msgInput");
  const fileInput = document.getElementById("fileInput");
  const attachBtn = document.getElementById("attachBtn");
  const filePreview = document.getElementById("filePreview");
  const filePreviewName = document.getElementById("filePreviewName");
  const filePreviewRemove = document.getElementById("filePreviewRemove");

  let pendingFile = null;

  function autoResize(){
    input.style.height = "auto";
    input.style.height = Math.min(input.scrollHeight, 200) + "px";
  }
  input.addEventListener("input", autoResize);

  attachBtn.addEventListener("click", () => fileInput.click());

  fileInput.addEventListener("change", () => {
    const f = fileInput.files[0];
    if (!f) return;
    if (f.size > 20 * 1024 * 1024) {
      alert("20MB 이하 파일만 첨부할 수 있어요.");
      fileInput.value = "";
      return;
    }
    pendingFile = f;
    filePreviewName.textContent = "📎 " + f.name;
    filePreview.style.display = "flex";
  });

  filePreviewRemove.addEventListener("click", () => {
    pendingFile = null;
    fileInput.value = "";
    filePreview.style.display = "none";
  });

  async function uploadFile(file){
    const path = `${Date.now()}_${file.name}`.replace(/\s+/g, "_");
    const { error: uploadError } = await client.storage.from(BUCKET).upload(path, file);
    if (uploadError) throw uploadError;
    const { data } = client.storage.from(BUCKET).getPublicUrl(path);
    return { url: data.publicUrl, name: file.name, type: file.type || "application/octet-stream" };
  }

  async function sendMessage(){
    const sender = document.getElementById("senderSelect").value;
    const content = input.value.trim();
    if (!content && !pendingFile) return;

    let attachment = null;
    if (pendingFile) {
      try {
        attachment = await uploadFile(pendingFile);
      } catch (e) {
        alert("파일 업로드 실패: " + (e && e.message ? e.message : e));
        return;
      }
    }

    input.value = "";
    autoResize();
    pendingFile = null;
    fileInput.value = "";
    filePreview.style.display = "none";

    const { error } = await client.from("meeting_messages").insert({
      room_id: ROOM_ID,
      sender,
      role: "human",
      content,
      attachment_url: attachment ? attachment.url : null,
      attachment_name: attachment ? attachment.name : null,
      attachment_type: attachment ? attachment.type : null,
    });
    if (error) alert("전송 실패: " + error.message);
  }

  document.getElementById("sendForm").addEventListener("submit", async (e) => {
    e.preventDefault();
    await sendMessage();
  });

  input.addEventListener("keydown", (e) => {
    if (e.key === "Enter" && !e.shiftKey) {
      e.preventDefault();
      sendMessage();
    }
  });

  loadHistory().then(subscribeRealtime);
</script>
</body>
</html>
