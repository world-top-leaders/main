<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>World Top Leaders — 실시간 회의실</title>
<style>
  :root{
    --bg:#0f1115; --panel:#171a21; --border:#2a2e38; --text:#e8e9ec; --muted:#8a8f9a;
    --아주:#f2c14e; --그록:#7fd1ff; --제미니:#a0e6a0; --클로드:#d7a3ff;
  }
  *{box-sizing:border-box;}
  body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Malgun Gothic",sans-serif;}
  header{padding:14px 16px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;}
  header h1{font-size:16px;margin:0;}
  #status{font-size:12px;color:var(--muted);}
  #log{height:calc(100vh - 130px);overflow-y:auto;padding:16px;}
  .msg{max-width:80%;margin-bottom:12px;padding:10px 14px;border-radius:12px;background:var(--panel);border:1px solid var(--border);}
  .msg .who{font-size:12px;font-weight:700;margin-bottom:4px;}
  .msg .content{white-space:pre-wrap;line-height:1.5;font-size:14px;}
  .msg .time{font-size:10px;color:var(--muted);margin-top:4px;text-align:right;}
  .msg.아주 .who{color:var(--아주);}
  .msg.그록 .who{color:var(--그록);}
  .msg.제미니 .who{color:var(--제미니);}
  .msg.클로드 .who{color:var(--클로드);}
  form{position:fixed;bottom:0;left:0;right:0;display:flex;gap:8px;padding:12px;background:var(--panel);border-top:1px solid var(--border);}
  select,input,button{font-size:14px;border-radius:8px;border:1px solid var(--border);background:#0f1115;color:var(--text);padding:10px;}
  input{flex:1;}
  button{background:var(--아주);color:#000;font-weight:700;border:none;cursor:pointer;}
</style>
</head>
<body>
<header>
  <h1>🗣️ World Top Leaders 회의실</h1>
  <div id="status">연결 중…</div>
</header>
<div id="log"></div>
<form id="sendForm">
  <select id="senderSelect">
    <option value="아주">아주</option>
  </select>
  <input id="msgInput" type="text" placeholder="메시지를 입력하세요…" autocomplete="off" required />
  <button type="submit">보내기</button>
</form>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
  const SUPABASE_URL = "https://hwdzjmeklzkszfqxbvsz.supabase.co";
  const SUPABASE_ANON_KEY = "sb_publishable_2JorYW_R1etapUtiZMI8Yg_gQTRO-f5";
  const ROOM_ID = "default";

  const log = document.getElementById("log");
  const status = document.getElementById("status");

  window.addEventListener("error", (e) => {
    status.textContent = "스크립트 오류: " + e.message;
  });

  if (typeof supabase === "undefined") {
    status.textContent = "supabase-js 로딩 실패 (CDN 차단 또는 네트워크 문제)";
    throw new Error("supabase 라이브러리를 불러오지 못했습니다.");
  }
  const client = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

  function renderMessage(m){
    const div = document.createElement("div");
    div.className = `msg ${m.sender}`;
    const time = new Date(m.created_at).toLocaleTimeString("ko-KR",{hour:"2-digit",minute:"2-digit"});
    div.innerHTML = `<div class="who">${m.sender}</div><div class="content"></div><div class="time">${time}</div>`;
    div.querySelector(".content").textContent = m.content;
    log.appendChild(div);
    log.scrollTop = log.scrollHeight;
  }

  async function loadHistory(){
    try {
      const { data, error } = await client
        .from("meeting_messages")
        .select("*")
        .eq("room_id", ROOM_ID)
        .order("created_at", { ascending: true })
        .limit(200);
      if (error) { status.textContent = "불러오기 오류: " + error.message; console.error(error); return; }
      data.forEach(renderMessage);
      status.textContent = "연결됨 (실시간)";
    } catch (e) {
      status.textContent = "연결 실패(네트워크/CORS 등): " + (e && e.message ? e.message : e);
      console.error("loadHistory 예외:", e);
    }
  }

  function subscribeRealtime(){
    client
      .channel("room-" + ROOM_ID)
      .on("postgres_changes",
        { event: "INSERT", schema: "public", table: "meeting_messages", filter: `room_id=eq.${ROOM_ID}` },
        (payload) => renderMessage(payload.new)
      )
      .subscribe((s) => { if (s === "SUBSCRIBED") status.textContent = "연결됨 (실시간)"; });
  }

  document.getElementById("sendForm").addEventListener("submit", async (e) => {
    e.preventDefault();
    const input = document.getElementById("msgInput");
    const sender = document.getElementById("senderSelect").value;
    const content = input.value.trim();
    if (!content) return;
    input.value = "";
    const { error } = await client.from("meeting_messages").insert({
      room_id: ROOM_ID, sender, role: "human", content
    });
    if (error) alert("전송 실패: " + error.message);
  });

  loadHistory().then(subscribeRealtime);
</script>
</body>
</html>
