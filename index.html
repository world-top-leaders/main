<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>World AI Leaders Report</title>
  <style>
    :root { --bg:#0b1020; --card:#121a2f; --line:#243049; --text:#e8eefc; --muted:#93a0b8; --accent:#5b8cff; --up:#3dd68c; --down:#ff6b7a; --new:#ffcc66; }
    * { box-sizing: border-box; }
    body { margin:0; font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif; background:linear-gradient(180deg,#0b1020,#10182c 40%,#0b1020); color:var(--text); }
    .wrap { max-width:1280px; margin:0 auto; padding:28px 18px 60px; }
    h1 { margin:0 0 8px; font-size:1.8rem; letter-spacing:-.02em; }
    .updated, .note { color:var(--muted); }
    .note { font-size:.92rem; line-height:1.5; margin:12px 0 18px; }
    a { color:var(--accent); text-decoration:none; }
    a:hover { text-decoration:underline; }
    .table-wrap { overflow:auto; border:1px solid var(--line); border-radius:14px; background:var(--card); }
    table { width:100%; border-collapse:collapse; min-width:980px; }
    th,td { padding:10px 12px; text-align:left; border-bottom:1px solid var(--line); vertical-align:top; }
    th { position:sticky; top:0; background:#18233d; color:#d7e3ff; font-size:.82rem; }
    tr:hover td { background:#17213a; }
    .rank,.num,.score { text-align:right; font-variant-numeric:tabular-nums; }
    .score { font-weight:700; }
    .meta { color:var(--muted); font-size:.8rem; margin-top:3px; }
    .up { color:var(--up); font-size:.8rem; }
    .down { color:var(--down); font-size:.8rem; }
    .same { color:var(--muted); font-size:.75rem; }
    .new { color:var(--new); font-size:.75rem; font-weight:700; }
    .links { font-size:.8rem; white-space:nowrap; }
    footer { margin-top:28px; color:var(--muted); font-size:.85rem; }
  </style>
</head>
<body>
  <div class="wrap">
    <h1>World AI Leaders Report</h1>
    <p class="updated" id="updated">Last updated: 2026-09-21</p>
    <p class="note">연구·사업·AGI·재산 4개 축 평균. 공개 자료 기반이며 공식 서열이 아닙니다.
      원본: <a href="https://github.com/world-top-leaders/main">GitHub</a> ·
      <a href="https://drive.google.com/drive/folders/1dSR2StutFYuN7imgH3RV40I8A0KdbJZm" target="_blank" rel="noopener">Google Drive</a>
    </p>
    <div class="table-wrap">
      <table>
        <thead>
          <tr>
            <th>순위</th><th>변동</th><th>이름</th><th>국적</th><th>분야</th>
            <th>연구</th><th>사업</th><th>AGI</th><th>재산</th><th>평균</th><th>링크</th>
          </tr>
        </thead>
        <tbody id="rows"><tr><td colspan="11">불러오는 중…</td></tr></tbody>
      </table>
    </div>
    <footer>World Top Leaders · public sources only</footer>
  </div>
  <script>
    const CSV_URL = "https://raw.githubusercontent.com/world-top-leaders/main/main/AI_Leaders_Report_2026-09-21.csv";
    const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&","<":"<",">":">","\"":""","'":"&#39;"}[c]));
    function parseCSV(text) {
      const lines = text.trim().split(/\r?\n/);
      const headers = [];
      const rows = [];
      const split = (line) => {
        const out = []; let cur = ""; let q = false;
        for (let i = 0; i < line.length; i++) {
          const ch = line[i];
          if (ch === '"') { q = !q; continue; }
          if (ch === ',' && !q) { out.push(cur); cur = ""; continue; }
          cur += ch;
        }
        out.push(cur); return out;
      };
      split(lines[0]).forEach(h => headers.push(h));
      for (let i = 1; i < lines.length; i++) {
        const cols = split(lines[i]);
        const row = {};
        headers.forEach((h, idx) => row[h] = cols[idx] ?? "");
        rows.push(row);
      }
      return rows;
    }
    function deltaHtml(rank, prev) {
      if (!prev || prev === "-") return '<span class="new">NEW</span>';
      const d = Number(prev) - Number(rank);
      if (d > 0) return `<span class="up">▲${d}</span>`;
      if (d < 0) return `<span class="down">▼${Math.abs(d)}</span>`;
      return '<span class="same">—</span>';
    }
    function link(url, label) {
      if (!url || url === "-") return "";
      return `<a href="${esc(url)}" target="_blank" rel="noopener">${label}</a>`;
    }
    fetch(CSV_URL).then(r => r.text()).then(text => {
      const data = parseCSV(text);
      document.getElementById("rows").innerHTML = data.map(r => {
        const name = `${r["이름"] || ""} ${r["성"] || ""}`.trim();
        const links = [link(r["Wikipedia"], "Wiki"), link(r["공식홈페이지"], "Site"), link(r["SNS"], "SNS")].filter(Boolean).join(" · ");
        return `<tr>
          <td class="rank">${esc(r["순위"])}</td>
          <td>${deltaHtml(r["순위"], r["이전순위"])}</td>
          <td><strong>${esc(name)}</strong><div class="meta">${esc(r["소속"])} · ${esc(r["직책"])}</div></td>
          <td>${esc(r["국적"])}</td>
          <td>${esc(r["전문분야"])}</td>
          <td class="num">${esc(r["연구점수"])}</td>
          <td class="num">${esc(r["사업점수"])}</td>
          <td class="num">${esc(r["AGI점수"])}</td>
          <td class="num">${esc(r["재산점수"])}</td>
          <td class="score">${esc(r["평균점수"])}</td>
          <td class="links">${links}</td>
        </tr>`;
      }).join("");
    }).catch(() => {
      document.getElementById("rows").innerHTML = '<tr><td colspan="11">데이터를 불러오지 못했습니다.</td></tr>';
    });
  </script>
</body>
</html>
