name: Sync docs to Google Drive

on:
  push:
    branches: [main]
    paths:
      - "docs/**"
      - "*.md"
      - "*.csv"
      - "*.html"
      - ".github/workflows/sync-to-drive.yml"
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    if: ${{ secrets.GOOGLE_DRIVE_FOLDER_ID != '' }}
    steps:
      - uses: actions/checkout@v4
      - name: Require secrets
        run: |
          if [ -z "${{ secrets.GDRIVE_SERVICE_ACCOUNT_JSON }}" ]; then
            echo "Add repo secret GDRIVE_SERVICE_ACCOUNT_JSON to enable Drive sync."
            exit 1
          fi
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Drive client
        run: pip install google-api-python-client google-auth
      - name: Upload changed files to Drive folder
        env:
          GDRIVE_SERVICE_ACCOUNT_JSON: ${{ secrets.GDRIVE_SERVICE_ACCOUNT_JSON }}
          GOOGLE_DRIVE_FOLDER_ID: ${{ secrets.GOOGLE_DRIVE_FOLDER_ID }}
        run: python scripts/sync_docs_to_drive.py
